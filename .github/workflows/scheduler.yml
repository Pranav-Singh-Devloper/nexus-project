# Wakes the backend (free hosting sleeps it). Any wake-up publishes scheduled
# posts that are due (see runSchedulerSoon in server/src/index.js).
# Backup pinger: GitHub's scheduled runs can be delayed or skipped, so a
# cron-job.org job hits the same URL as the main one.
name: scheduler

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          URL="${BACKEND_URL:-https://nexus-backend-nwvq.onrender.com}/api/wake"
          # Cold starts can take up to a minute, so retry a few times.
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/out -w '%{http_code}' -m 90 "$URL" || true)
            echo "attempt $i: HTTP $code $(cat /tmp/out 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          exit 1
