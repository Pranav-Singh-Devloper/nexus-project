<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nexus turns AI market research into ready-to-post LinkedIn content." />
    <meta name="theme-color" content="#F4EDE0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1428" media="(prefers-color-scheme: dark)" />
    <title>Nexus — Market Intelligence</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nexus — Market Intelligence" />
    <meta property="og:description" content="AI market research that turns into ready-to-post LinkedIn content." />
    <meta property="og:image" content="https://nexus-ai-swarm.vercel.app/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />

    <meta name="twitter:image" content="https://nexus-ai-swarm.vercel.app/brand/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint so there's no flash.
      // Light is the default; dark only if the visitor chose it.
      (function () {
        var pref = 'light';
        try { pref = localStorage.getItem('nexus-theme') || 'light'; } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
